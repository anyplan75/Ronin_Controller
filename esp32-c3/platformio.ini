; 보드 담당을 빌드 env 로 고정합니다. 역할을 섞지 않습니다.
; c3-oled  = 로닌 RS2 + OLED  (/dev/cu.usbmodem11201)
; c3-rmsid = 로닌 SC
; s3-light = 울란지 VL200BI 두 대 (/dev/cu.usbmodem5CF70236321)

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  links2004/WebSockets @ ^2.6.1
  h2zero/NimBLE-Arduino @ ^1.4.3
  olikraus/U8g2 @ ^2.35.19

[env:esp32-c3]
extends = common
board = esp32-c3-devkitm-1
monitor_port = /dev/cu.usbmodem11201
upload_port = /dev/cu.usbmodem11201
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_SLOT_OLED=1
  -DFW_VERSION=\"1.0.46\"

[env:c3-oled]
extends = env:esp32-c3

[env:c3-rmsid]
extends = common
board = esp32-c3-devkitm-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_SLOT_RMSID=1
  -DFW_VERSION=\"1.0.46\"

[env:s3-light]
extends = common
board = esp32-s3-devkitc-1
monitor_port = /dev/cu.usbmodem5CF70236321
upload_port = /dev/cu.usbmodem5CF70236321
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_SLOT_S3=1
  -DFW_VERSION=\"1.0.46\"
