; 액션5 프로 브리지 전용입니다.
; 로닌 짐벌용 esp32-poe 환경과는 폴더가 분리되어 있습니다.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
    -DCONFIG_NIMBLE_MAX_CONNECTIONS=4
    -DCONFIG_BT_NIMBLE_MAX_BONDS=4
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=16
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=6144
