; 보드 담당을 빌드 env 로 고정합니다. 역할을 섞지 않습니다.
; c3-oled  = 로닌 RS2 + OLED  (/dev/cu.usbmodem11201)
; c3-rmsid = 로닌 SC (.154) — upload_port 는 USB 꽂힌 뒤 확인
; s3-light = 울란지 VL200BI 두 대 (/dev/cu.usbmodem5CF70236321)
; OTA 앱 칸 1.25MB(0x140000) 안에 넣기 위해 슬롯별 미사용 코드·로그를 뺍니다.

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -O2
build_flags =
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  -DCONFIG_BT_NIMBLE_MAX_BONDS=2
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=12
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  links2004/WebSockets @ ^2.6.1
  h2zero/NimBLE-Arduino @ ^1.4.3

[env:esp32-c3]
extends = common
board = esp32-c3-devkitm-1
monitor_port = /dev/cu.usbmodem11201
upload_port = /dev/cu.usbmodem11201
; OLED 는 자체 soft-I2C 드라이버(U8g2 제외)로 플래시 절약
build_src_filter = +<*> -<ulanzi_ble.cpp>
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_SLOT_OLED=1
  -DBOARD_HAS_RONIN=1
  -DFW_VERSION=\"1.0.61\"

[env:c3-oled]
extends = env:esp32-c3

[env:c3-rmsid]
extends = common
board = esp32-c3-devkitm-1
monitor_port = /dev/cu.usbmodem1401
upload_port = /dev/cu.usbmodem1401
; RMSID 는 OLED·울란지 없음
build_src_filter = +<*> -<ulanzi_ble.cpp>
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_SLOT_RMSID=1
  -DBOARD_HAS_RONIN=1
  -DFW_VERSION=\"1.0.61\"

[env:s3-light]
extends = common
board = esp32-s3-devkitc-1
monitor_port = /dev/cu.usbmodem5CF70236321
upload_port = /dev/cu.usbmodem5CF70236321
build_src_filter = +<*> -<ronin_ble.cpp>
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_SLOT_S3=1
  -DBOARD_HAS_LIGHT=1
  -DFW_VERSION=\"1.0.61\"
