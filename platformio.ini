; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-poe]
platform = espressif32
board = esp32-poe
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<gopro_relay/> -<olimex_hub/>

; 올리멕스 ESP32-PoE 액션캠 블루투스 허브입니다. 웹소켓은 81번입니다.
[env:olimex-hub]
platform = espressif32
board = esp32-poe
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-140
upload_port = /dev/cu.usbserial-140
build_src_filter = +<olimex_hub/>
build_flags = -Iesp32-c3/include -Isrc/gopro_relay
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  mathieucarbou/AsyncTCP @ ^3.2.14
  mathieucarbou/ESPAsyncWebServer @ ^3.3.23
  h2zero/NimBLE-Arduino @ ^1.4.3

; 로닌 PoE 기판이 아닙니다. 고프로 액션 5 프로 한 대용 중계 기판입니다.
[env:gopro-relay]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<gopro_relay/>
